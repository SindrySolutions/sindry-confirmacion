<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Correo confirmado | Sindry ERP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f3f6f9;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(20, 40, 61, 0.12);
    }

    .brand {
      background: #dbe7f3;
      padding: 26px 32px;
      text-align: center;
    }

    .brand img {
      display: block;
      max-width: 280px;
      max-height: 100px;
      width: auto;
      height: auto;
      margin: 0 auto;
      object-fit: contain;
    }

    .content {
      padding: 40px 36px 36px;
      text-align: center;
    }

    .icon {
      width: 66px;
      height: 66px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef4f8;
      color: #14283d;
      font-size: 36px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 15px;
      color: #14283d;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: #667085;
      font-size: 15px;
      line-height: 1.65;
    }

    .footer {
      padding: 19px 24px;
      text-align: center;
      background: #f8fafc;
      border-top: 1px solid #e5e7eb;
      color: #7c8796;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="brand">
      <img src="logo.png" alt="Sindry ERP">
    </div>

    <div class="content">

      <div class="icon">✓</div>

      <h1>Correo confirmado correctamente</h1>

      <p>
        Tu cuenta de Sindry ya está activa.<br>
        Puedes cerrar esta ventana y regresar a Sindry para iniciar sesión.
      </p>

    </div>

    <div class="footer">
      Sindry ERP
    </div>

  </div>

</body>
</html>
