<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">\n  <meta name="build-version" content="bilingual-v2">
  <title>Sindry ERP</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f3f6f9;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(20, 40, 61, 0.12);
    }

    .brand {
      position: relative;
      background: #e8eef5;
      padding: 26px 32px;
      text-align: center;
    }

    .brand img {
      display: block;
      max-width: 280px;
      max-height: 100px;
      width: auto;
      height: auto;
      margin: 0 auto;
      object-fit: contain;
    }

    .lang {
      position: absolute;
      top: 14px;
      right: 16px;
      display: flex;
      gap: 6px;
    }

    .lang button {
      border: 1px solid #cbd6e2;
      border-radius: 8px;
      background: rgba(255,255,255,.7);
      color: #52657a;
      padding: 5px 7px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .lang button.active {
      background: #14283d;
      color: #ffffff;
      border-color: #14283d;
    }

    .content {
      padding: 40px 36px 36px;
      text-align: center;
    }

    .icon {
      width: 66px;
      height: 66px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef4f8;
      color: #14283d;
      font-size: 36px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 15px;
      color: #14283d;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: #667085;
      font-size: 15px;
      line-height: 1.65;
    }

    .footer {
      padding: 19px 24px;
      text-align: center;
      background: #f8fafc;
      border-top: 1px solid #e5e7eb;
      color: #7c8796;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="brand">
      <img src="logo.png" alt="Sindry ERP">
      <div class="lang" aria-label="Language">
        <button id="langEs" type="button">ES</button>
        <button id="langEn" type="button">EN</button>
      </div>
    </div>

    <div class="content">
      <div class="icon">✓</div>
      <h1 id="heading"></h1>
      <p id="message"></p>
    </div>

    <div class="footer">Sindry ERP</div>
  </div>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const requested = (params.get("lang") || navigator.language || "es").toLowerCase();
      const lang = requested.startsWith("en") ? "en" : "es";

      const copy = {
        es: {
          title: "Correo confirmado | Sindry ERP",
          heading: "Correo confirmado correctamente",
          message: "Tu cuenta de Sindry ya está activa.\nPuedes cerrar esta ventana y regresar a Sindry para iniciar sesión."
        },
        en: {
          title: "Email confirmed | Sindry ERP",
          heading: "Email confirmed successfully",
          message: "Your Sindry account is now active.\nYou can close this window and return to Sindry to sign in."
        }
      }[lang];

      document.documentElement.lang = lang;
      document.title = copy.title;
      document.getElementById("heading").textContent = copy.heading;

      const message = document.getElementById("message");
      copy.message.split("\n").forEach((line, index) => {
        if (index) message.appendChild(document.createElement("br"));
        message.appendChild(document.createTextNode(line));
      });

      document.getElementById("langEs").classList.toggle("active", lang === "es");
      document.getElementById("langEn").classList.toggle("active", lang === "en");

      const setLang = (next) => {
        const nextParams = new URLSearchParams(window.location.search);
        nextParams.set("lang", next);
        window.location.search = nextParams.toString();
      };

      document.getElementById("langEs").addEventListener("click", () => setLang("es"));
      document.getElementById("langEn").addEventListener("click", () => setLang("en"));
    })();
  </script>
</body>
</html>
